name: Deploy Website to GitHub Pages

on:
  # Tự động chạy mỗi khi có lệnh push lên nhánh main (hoặc master)
  push:
    branches: ["main"]

  # Cho phép bạn chạy thủ công từ tab "Actions" trên GitHub
  workflow_dispatch:

# Phân quyền cho token truy cập repository
permissions:
  contents: read
  pages: write
  id-token: write

# Cho phép chỉ định một tiến trình deploy chạy đơn lẻ để tránh xung đột
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Chỉ định thư mục chứa file index.html của bạn (ở đây để thư mục gốc .)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
