name: Deploy Chi Đoàn Ấp Tân An to GitHub Pages

on:
  # Tự động kích hoạt khi có lệnh push lên nhánh main (hoặc master)
  push:
    branches: ["main"]

  # Cho phép bạn bấm nút chạy thủ công từ tab "Actions" trên GitHub
  workflow_dispatch:

# Phân quyền cần thiết cho GITHUB_TOKEN để triển khai GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một tiến trình deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v4

      - name: Tải lên gói dữ liệu (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          # Thư mục chứa tệp index.html của bạn (dấu chấm nghĩa là thư mục gốc)
          path: '.'

      - name: Tiến hành Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
