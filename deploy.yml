name: Deploy Chi Doan Tan An to GitHub Pages

on:
  # Chạy tự động mỗi khi có lệnh đẩy code (push) lên nhánh main
  push:
    branches: ["main"] # Nếu nhánh chính của bạn là master, hãy đổi thành "master"

  # Cho phép bạn kích hoạt chạy thủ công từ tab "Actions" trên GitHub
  workflow_dispatch:

# Cấp quyền cần thiết cho GITHUB_TOKEN để triển khai GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một tiến trình deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v4

      - name: Tải lên mã nguồn (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          # Thư mục chứa file index.html (dùng dấu chấm '.' nếu file nằm ở thư mục gốc)
          path: '.'

      - name: Tiến hành Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
